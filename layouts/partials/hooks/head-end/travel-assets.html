{{ if eq .Section "travel" }}
  {{ $travelCSS := resources.Get "css/travel.css" | minify | fingerprint "sha256" }}
  {{ $travelJS := resources.Get "js/travel.js" | minify | fingerprint "sha256" }}
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css"
    integrity="sha384-mnM9NG1099tBMNxdDQNDKIxYcn/fmqQXFJvbT5l1MsrWvzfxBEffceBsw75/cW2R"
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ $travelCSS.RelPermalink }}" integrity="{{ $travelCSS.Data.Integrity }}">
  <script
    defer
    src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"
    integrity="sha384-7+0QVD3+GoeOjaW35yTmpj0FR1K45ugw4ZUY0qEFomHSmAude6e9nB6/Xy5aPnzQ"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script defer src="{{ $travelJS.RelPermalink }}" integrity="{{ $travelJS.Data.Integrity }}"></script>
{{ end }}
